<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121C26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budgets">
  <title>Teph Seal Budgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><b id="appName">Teph Seal Budgets</b><button class="who" id="who" type="button">Loading…</button></div>
      <div class="month" role="group" aria-label="Month" hidden>
        <button id="prev" type="button" aria-label="Previous month">‹</button>
        <output id="monthLabel">—</output>
        <button id="next" type="button" aria-label="Next month">›</button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view"></main>
  </div>
  <nav class="nav" id="nav" aria-label="Sections" hidden><div class="nav-in" id="navIn"></div></nav>
  <div id="sheetRoot"></div>

  <!-- Supabase client library (pinned version) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- Your project keys -->
  <script src="js/config.js"></script>
  <!-- The app -->
  <script src="js/app.js"></script>
</body>
</html>
